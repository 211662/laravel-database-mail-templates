version: '3.8'

services:
  # PHP Application
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tempemail_app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
      - ./storage:/var/www/html/storage
    environment:
      - APP_ENV=local
      - APP_DEBUG=true
      - DB_HOST=mysql
      - DB_DATABASE=tempemail
      - DB_USERNAME=tempemail
      - DB_PASSWORD=secret
      - REDIS_HOST=redis
      - QUEUE_CONNECTION=redis
    networks:
      - tempemail
    depends_on:
      - mysql
      - redis

  # Nginx Web Server
  nginx:
    image: nginx:alpine
    container_name: tempemail_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./:/var/www/html
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./docker/nginx/conf.d:/etc/nginx/conf.d
    networks:
      - tempemail
    depends_on:
      - app

  # MySQL Database
  mysql:
    image: mysql:8.0
    container_name: tempemail_mysql
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      MYSQL_DATABASE: tempemail
      MYSQL_USER: tempemail
      MYSQL_PASSWORD: secret
      MYSQL_ROOT_PASSWORD: root_secret
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - tempemail

  # Redis Cache & Queue
  redis:
    image: redis:7-alpine
    container_name: tempemail_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - tempemail

  # Queue Worker
  queue:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tempemail_queue
    restart: unless-stopped
    working_dir: /var/www/html
    command: php artisan queue:work --sleep=3 --tries=3
    volumes:
      - ./:/var/www/html
    environment:
      - APP_ENV=local
      - DB_HOST=mysql
      - DB_DATABASE=tempemail
      - DB_USERNAME=tempemail
      - DB_PASSWORD=secret
      - REDIS_HOST=redis
      - QUEUE_CONNECTION=redis
    networks:
      - tempemail
    depends_on:
      - mysql
      - redis

  # Scheduler (for cron jobs)
  scheduler:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tempemail_scheduler
    restart: unless-stopped
    working_dir: /var/www/html
    command: >
      sh -c "while true; do
        php artisan schedule:run >> /dev/null 2>&1
        sleep 60
      done"
    volumes:
      - ./:/var/www/html
    environment:
      - APP_ENV=local
      - DB_HOST=mysql
      - DB_DATABASE=tempemail
      - DB_USERNAME=tempemail
      - DB_PASSWORD=secret
    networks:
      - tempemail
    depends_on:
      - mysql

  # Mailpit (Email Testing)
  mailpit:
    image: axllent/mailpit
    container_name: tempemail_mailpit
    restart: unless-stopped
    ports:
      - "8025:8025"  # Web UI
      - "1025:1025"  # SMTP
    networks:
      - tempemail

networks:
  tempemail:
    driver: bridge

volumes:
  mysql_data:
    driver: local
  redis_data:
    driver: local
